services:
  proxy:
    build: .
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    expose:
      - "3030"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
