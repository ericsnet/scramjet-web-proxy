<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inici - Classroom</title>
<style>
	:root {
		color-scheme: dark;
		--bg: #161513;
		--surface: #1c1a18;
		--text: #efe9de;
		--text-soft: #aaa398;
		--muted: #948d83;
		--border: rgba(239, 233, 222, 0.12);
		--accent: #8fb6f0;
		--accent-ink: #12110f;
		--danger: #e88b8b;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100dvh;
		display: grid;
		place-items: center;
		padding: 20px;
		background: var(--bg);
		color: var(--text);
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	.card {
		width: min(600px, 100%);
		padding: 32px;
		border: 1px solid var(--border);
		border-radius: 16px;
		background: var(--surface);
		text-align: left;
	}
	.top {
		display: flex;
		align-items: center;
		gap: 12px;
		margin-bottom: 24px;
		color: var(--muted);
		font-size: 12px;
	}
	.top svg {
		width: 44px;
		height: 44px;
		padding: 11px;
		border: 1px solid var(--border);
		border-radius: 10px;
		background: var(--surface-2);
		color: var(--muted);
	}
	.code {
		margin-bottom: 16px;
		color: var(--text);
		font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
		font-size: clamp(56px, 12vw, 88px);
		font-weight: 500;
		letter-spacing: -0.06em;
		line-height: 0.95;
	}
	h1 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; }
	p { margin: 0; max-width: none; color: var(--text-soft); font-size: 15px; line-height: 1.6; }
	.actions { display: flex; justify-content: flex-start; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
	.retry, .link {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-height: 44px;
		padding: 10px 16px;
		border-radius: 8px;
		font-size: 13px;
		font-weight: 500;
		text-decoration: none;
	}
	.retry { background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink); }
	.retry:hover { background: #a8c7f5; }
	.link { border: 1px solid var(--border); color: var(--text); background: transparent; }
	.link:hover { border-color: var(--text-soft); }
	.status { margin-top: 20px; color: var(--muted); font-size: 13px; }
	.hint { margin-top: 8px; color: var(--muted); font-size: 12.5px; }
	@media (max-width: 480px) {
		.card { padding: 30px 20px 24px; }
		.actions { flex-direction: column; }
		.retry, .link { width: 100%; }
	}
</style>
</head>
<body>
<main class="card" role="alert">
	<div class="top">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7h.01M7 16h.01"/></svg>
		<span>Servidor</span>
	</div>
	<div class="code">503</div>
	<h1>Servicio no disponible</h1>
	<p>El proxy se está reiniciando o está temporalmente fuera de servicio. No hace falta que cierres esta pestaña: se reconectará automáticamente.</p>
	<div class="actions">
		<a class="retry" href="/">Reintentar ahora</a>
		<a class="link" href="/login">Ir al login</a>
	</div>
	<p class="status" id="status">Comprobando conexión…</p>
	<p class="hint">Si tarda más de un minuto, avisa al administrador.</p>
</main>
<script>
(() => {
	const status = document.getElementById("status");
	let attempts = 0;
	let timer = null;
	async function check() {
		attempts += 1;
		try {
			const response = await fetch("/healthz", { method: "HEAD", cache: "no-store" });
			if (response.ok) {
				status.textContent = "Conexión restablecida. Recargando…";
				clearInterval(timer);
				location.reload();
				return;
			}
		} catch {}
		status.textContent = `Sin conexión. Reintentando automáticamente… (${attempts})`;
	}
	check();
	timer = setInterval(check, 3000);
	window.addEventListener("pagehide", () => clearInterval(timer));
})();
</script>
</body>
</html>
