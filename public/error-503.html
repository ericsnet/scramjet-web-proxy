<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inici - Classroom</title>
<style>
	:root {
		color-scheme: dark;
		--bg: #161513;
		--surface: #1c1a18;
		--text: #efe9de;
		--text-soft: #aaa398;
		--muted: #948d83;
		--border: rgba(239, 233, 222, 0.12);
		--accent: #8fb6f0;
		--accent-ink: #12110f;
		--danger: #e88b8b;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100dvh;
		display: grid;
		place-items: center;
		padding: 20px;
		background: var(--bg);
		color: var(--text);
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	.card {
		width: min(560px, 100%);
		padding: 40px 32px 30px;
		border: 1px solid var(--border);
		border-radius: 16px;
		background: var(--surface);
		text-align: center;
	}
	.logo { width: 64px; height: 64px; margin: 0 auto 18px; display: block; }
	.code {
		color: var(--text);
		font-size: clamp(72px, 16vw, 112px);
		font-weight: 600;
		letter-spacing: -0.06em;
		line-height: 0.9;
	}
	h1 { margin: 20px 0 10px; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; }
	p { margin: 0 auto; max-width: 450px; color: var(--text-soft); font-size: 15px; line-height: 1.6; }
	.actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
	.retry, .link {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-height: 44px;
		padding: 10px 16px;
		border-radius: 8px;
		font-size: 13px;
		font-weight: 500;
		text-decoration: none;
	}
	.retry { background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink); }
	.retry:hover { background: #a8c7f5; }
	.link { border: 1px solid var(--border); color: var(--text); background: transparent; }
	.link:hover { border-color: var(--text-soft); }
	.status { margin-top: 20px; color: var(--muted); font-size: 13px; }
	.hint { margin-top: 8px; color: var(--muted); font-size: 12.5px; }
	@media (max-width: 480px) {
		.card { padding: 30px 20px 24px; }
		.actions { flex-direction: column; }
		.retry, .link { width: 100%; }
	}
</style>
</head>
<body>
<main class="card" role="alert">
	<svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
		<rect width="64" height="64" rx="16" fill="#12110f" />
		<path d="M14 19c7-3 13-2 18 2v26c-5-4-11-5-18-2z" fill="#8fb6f0" />
		<path d="M50 19c-7-3-13-2-18 2v26c5-4 11-5 18-2z" fill="#a8c7f5" />
		<path d="M32 21v26" stroke="#12110f" stroke-width="3" />
		<path d="M18 25c4-1 8-1 11 1" stroke="#12110f" stroke-width="2" stroke-linecap="round" opacity=".55" />
		<path d="M46 25c-4-1-8-1-11 1" stroke="#12110f" stroke-width="2" stroke-linecap="round" opacity=".55" />
	</svg>
	<div class="code">503</div>
	<h1>Servicio no disponible</h1>
	<p>El proxy se está reiniciando o está temporalmente fuera de servicio. No hace falta que cierres esta pestaña: se reconectará automáticamente.</p>
	<div class="actions">
		<a class="retry" href="/">Reintentar ahora</a>
		<a class="link" href="/login">Ir al login</a>
	</div>
	<p class="status" id="status">Comprobando conexión…</p>
	<p class="hint">Si tarda más de un minuto, avisa al administrador.</p>
</main>
<script>
(() => {
	const status = document.getElementById("status");
	let attempts = 0;
	let timer = null;
	async function check() {
		attempts += 1;
		try {
			const response = await fetch("/healthz", { method: "HEAD", cache: "no-store" });
			if (response.ok) {
				status.textContent = "Conexión restablecida. Recargando…";
				clearInterval(timer);
				location.reload();
				return;
			}
		} catch {}
		status.textContent = `Sin conexión. Reintentando automáticamente… (${attempts})`;
	}
	check();
	timer = setInterval(check, 3000);
	window.addEventListener("pagehide", () => clearInterval(timer));
})();
</script>
</body>
</html>
