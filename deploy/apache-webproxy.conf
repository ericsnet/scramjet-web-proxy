# Apache reverse proxy example for Scramjet Web Proxy.
# Replace proxy.example.com and adjust paths/ports.
# Requires: a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl

Listen 127.0.0.1:8082

<VirtualHost 127.0.0.1:8082>
    ServerName proxy.example.com
    ServerAdmin admin@example.com

    ErrorLog ${APACHE_LOG_DIR}/webproxy-error.log
    CustomLog ${APACHE_LOG_DIR}/webproxy-access.log combined

    # Authentication is handled by Node. Force HTTPS scheme for Secure cookies
    # when this vhost is reached through an HTTPS tunnel.
    RequestHeader setifempty X-Forwarded-Proto "https"

    # Security headers. Keep Referrer-Policy compatible with same-origin form
    # POSTs: "no-referrer" makes some Chromium versions send Origin: null.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: wss: data: blob:; frame-src 'self' blob: data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"

    # Never cache the service worker.
    <Location "/sw.js">
        Header always set Cache-Control "no-store, no-cache, must-revalidate"
        Header always set Service-Worker-Allowed "/"
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    # Wisp requires WebSocket upgrades.
    ProxyPass "/wisp/" "ws://127.0.0.1:3030/wisp/" retry=0
    ProxyPassReverse "/wisp/" "ws://127.0.0.1:3030/wisp/"

    ProxyPass "/" "http://127.0.0.1:3030/" retry=0
    ProxyPassReverse "/" "http://127.0.0.1:3030/"
</VirtualHost>
